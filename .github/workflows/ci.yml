name: Verify NEXORA Remote
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          {
            name: network-benchmark,
            path: artifacts/network-benchmark.json,
            retention-days: 14,
          }
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: { name: web-server-build, path: dist, retention-days: 14 }
  netem:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: bash .github/scripts/test-netem.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          {
            name: netem-network-evidence,
            path: artifacts/netem-*,
            retention-days: 14,
          }
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexora_ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: nexora_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nexora_ci" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: node --import tsx tests/postgres.integration.ts
        env:
          TEST_DATABASE_URL: postgres://nexora_ci:ci-only-disposable@127.0.0.1:5432/nexora_ci
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          {
            name: playwright-results,
            path: test-results,
            retention-days: 7,
            if-no-files-found: ignore,
          }
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build apps/windows-agent/Nexora.Agent/Nexora.Agent.csproj -c Release
      - run: dotnet run --project tests/agent-contract/Agent.Contract.csproj -c Release
      - run: dotnet run --project tests/management-contract/Management.Contract.csproj -c Release
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - name: Windows IPC, DPAPI, encoding and real loopback engine validation
        shell: pwsh
        env: { NEXORA_TEST_BACKEND: "http://127.0.0.1:3000" }
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $server = Start-Process node -ArgumentList @('--import','tsx','tests/e2e/harness.ts') -PassThru -RedirectStandardOutput artifacts/loopback-backend.log -RedirectStandardError artifacts/loopback-backend-error.log
          try {
            $ready = $false
            for ($attempt=0; $attempt -lt 30; $attempt++) {
              try { Invoke-RestMethod http://127.0.0.1:3000/api/health | Out-Null; $ready=$true; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Loopback backend did not start' }
            & dotnet run --project tests/windows-native/Windows.Native.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw "Windows validation exit $LASTEXITCODE" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          {
            name: windows-validation-evidence,
            path: artifacts/windows-validation.json,
            retention-days: 14,
          }
      - name: Checkout immutable 0.2.0 upgrade baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7072a40efe11f47b016248a217b3a3e743ed4aeb
          path: upgrade-baseline
      - name: Build old 0.2.0 Agent for real upgrade
        run: dotnet publish upgrade-baseline/apps/windows-agent/Nexora.Agent/Nexora.Agent.csproj -c Release -r win-x64 --self-contained true -o upgrade-baseline/artifacts/agent
      - run: dotnet publish apps/windows-agent/Nexora.Agent/Nexora.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/agent
      - shell: pwsh
        run: Copy-Item -Recurse docs/licenses artifacts/agent/licenses
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" apps/windows-agent/installer/Nexora.iss'
      - name: Build immutable 0.2 installer
        shell: pwsh
        run: |
          Copy-Item -Recurse docs/licenses upgrade-baseline/artifacts/agent/licenses
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" upgrade-baseline/apps/windows-agent/installer/Nexora.iss
          if ($LASTEXITCODE -ne 0) { throw 'Baseline installer failed' }
      - name: Verify visible install and clean uninstall without launching Agent
        shell: pwsh
        run: ./.github/scripts/test-installer.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-agent-unsigned-engineering-preview
          path: |
            artifacts/agent
            artifacts/*-unsigned.exe
            artifacts/installer-smoke.json
            artifacts/windows-validation.json
            artifacts/installer-*.log
            artifacts/service-smoke.log
            artifacts/loopback-backend*.log
          retention-days: 14
