events {}
http { include /etc/nginx/mime.types;
 server { listen 80; root /usr/share/nginx/html; client_max_body_size 64k;
 location /api/ { proxy_pass http://backend:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 70s; }
 location / { try_files $uri /index.html; }
 }
}
